<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiry Notifier · fully working dashboard</title>
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Dashboard.css"/>
</head>
<body>
    <header>
         <nav style="display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 20px 60px;
                    background-color: #E5D7C3;
                    box-shadow: 0 2px 5px black;">
                <a href="index.html" style="text-decoration:none;"><div class="logo">Expiry<span>Notifier</span></div></a>
                <ul style="display: flex; gap: 40px; list-style:none;">
                    <li><a href="Dashboard.html">Features</a></li>
                    <li><a href="How it works.html">How it works</a></li>
                    <li><a href="Testimonials.html">Testimonials</a></li>            
                    <li><a href="Pricing.html">Pricing</a></li>
                </ul>
                <div class="cta-btns">
                    <!-- <button class="login">Log in</button> -->
                    <button class="cta-btns" id="getStartedBtn">Start for Free Trial</button>
                </div>
            </nav>
    </header>
    <!-- LANDING PAGE (visible by default) -->
    <div id="landingPage">
        <div class="landing">
            <div class="hero">
                <div class="icon-row">
                    <i class="fas fa-pills"></i>
                    <i class="fas fa-apple-alt"></i>
                    <i class="fas fa-id-card"></i>
                </div>
            </div>
            <div class="feature-grid">
                <div class="feature"><i class="fas fa-calendar-check fa-2x" style="color:#6F5B56;"></i><h3>Track expiry dates</h3><p>medicines, food, documents</p></div>
                <div class="feature"><i class="fas fa-bell fa-2x" style="color:#6F5B56;"></i><h3>Timely reminders</h3><p>get notified before it’s too late</p></div>
                <div class="feature"><i class="fas fa-exclamation-triangle fa-2x" style="color:#6F5B56;"></i><h3>Color‑coded alerts</h3><p>green/yellow/red at a glance</p></div>
            </div>
            <!-- <div class="footer">© 2025 Expiry Notifier · Sandip University · BCA Project</div> -->
       </div>
    </div>

       <!-- DASHBOARD + PAGES (hidden initially) -->
       <div id="dashboardApp" class="hidden">
           <div class="app-wrapper">
               <!-- SIDEBAR with click handlers -->
               <div class="sidebar">
                  <a href="Dashboard.html" style="text-decoration: none;"><div class="sidebar-logo"><i class="fas fa-bell"></i> Expiry</div></a>
                  <div class="nav-item active" data-page="dashboard"><i class="fas fa-th-large"></i> Dashboard</div>
                  <div class="nav-item" data-page="addItem"><i class="fas fa-plus-circle"></i> Add Item</div>
                  <div class="nav-item" data-page="notifications"><i class="fas fa-bell"></i> Notifications</div>
                  <div class="nav-item" data-page="profile"><i class="fas fa-user-circle"></i> Profile</div>
               </div>

               <!-- main panel where dynamic content loads -->
               <div class="main-panel" id="mainPanel">
                   <!-- Top navbar -->
                   <div class="top-nav">
                      <span class="page-title" id="currentPageTitle"><i class="fas fa-clock"></i> Dashboard</span>
                      <div class="profile-icon"><i class="fas fa-user-astronaut"></i></div>
                   </div>

                   <!-- DYNAMIC CONTENT CONTAINER -->
                   <div id="pageContent"></div>
               </div>
           </div>
       </div>  
<Script src="Dashboard.js"></Script>
    </body>
</html>
